; Seeed SenseCAP T1000-A (Goodix GR5515 + LR1110 + AG3335)
; Needs platform-gr551x (PlatformIO platform + Arduino core for Goodix GR551x).
; Flashing: pio run -t upload (BLE DFU through the stock Seeed bootloader), or the CLI "start ota" command.

[t1000-a]
extends = arduino_base
platform = https://github.com/Artemia76/platform-gr551x.git
board = t1000-a
build_flags = ${arduino_base.build_flags}
  -D GR551X_PLATFORM
  -I src/helpers/gr551x
  -I variants/t1000-a
  -D T1000_A
  -D RADIO_CLASS=CustomLR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D USE_LR1110
  -D LORA_TX_POWER=22
  -D RX_BOOSTED_GAIN=true
  -D P_LORA_NSS=6
  -D P_LORA_DIO_1=0x21        ; AON1 (inverted on the board, handled by the variant)
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D LR11X0_DIO_AS_RF_SWITCH=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=3.0
  -D T1000A_BLE_CONSOLE
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/gr551x>
  +<../variants/t1000-a>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32

[env:t1000a_companion_radio_ble]
extends = t1000-a
build_flags = ${t1000-a.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"@@MAC"'
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${t1000-a.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${t1000-a.lib_deps}
  densaugeo/base64 @ ~1.4.0
