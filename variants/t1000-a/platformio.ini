; Seeed SenseCAP T1000-A (Goodix GR5515 + LR1110 + AG3335)
; Needs platform-gr551x (PlatformIO platform + Arduino core for Goodix GR551x).
; Flashing: pio run -t upload (BLE DFU through the stock Seeed bootloader), or the CLI "start ota" command.

[t1000-a]
extends = arduino_base
platform = https://github.com/Artemia76/platform-gr551x.git#v0.1.0
board = t1000-a
build_flags = ${arduino_base.build_flags}
  -D GR551X_PLATFORM
  -I src/helpers/gr551x
  -I variants/t1000-a
  -I src/helpers/ui
  -D T1000_A
  -D RADIO_CLASS=CustomLR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D USE_LR1110
  -D LORA_TX_POWER=22
  -D RX_BOOSTED_GAIN=true
  -D LR11X0_RX_DUTY_CYCLE=1   ; receive in duty cycle (~36 % listening at SF8/62.5 kHz), console "rxduty"
  -D P_LORA_NSS=6
  -D P_LORA_DIO_1=0x21        ; AON1 (inverted on the board, handled by the variant)
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D LR11X0_DIO_AS_RF_SWITCH=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=3.0
  -D PIN_USER_BTN=0x20        ; AON0, active high
  -D USER_BTN_PRESSED=HIGH
  -D PIN_STATUS_LED=0x23      ; AON3 (PWM1_A: dimmable)
  -D EXT_CHRG_DETECT=0x24     ; AON4, low while charging (charger status, pull-up)
  -D PIN_EXT_POWER=0x30       ; MSIO0, ~2.5 V when the charging cable is plugged in
  -D STATUS_LED_CHARGE_ANIM   ; ui-orig: breathing LED while charging, activity shown in negative
  -D STATUS_LED_WAKE=gr551x_wake_in   ; ui-orig: wake the CPU to end the heartbeat flash on time
  -D GPS_EN=28
  -D GPS_VRTC_EN=27
  -D GPS_RESET=16             ; active low on the T1000-A
  -D GPS_SLEEP_INT=29
  -D GPS_RTC_INT=24
  -D GPS_RESETB=25
  -D GPS_BAUD_RATE=115200
  -D GPS_NOSKY_TIMEOUT_MS=60000UL   ; indoors: stop a periodic GPS window after 60 s without any satellite...
  -D GPS_NOSKY_MAX_PERIOD_S=1800UL  ; ...then retry after period, 2 x period... up to 30 min
  -D UART_TYPE=GR551xUart
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/gr551x>
  +<../variants/t1000-a>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  stevemarple/MicroNMEA @ ^2.0.6

[env:t1000a_companion_radio_ble]
extends = t1000-a
build_flags = ${t1000-a.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"@@MAC"'
  -I examples/companion_radio/ui-orig
  -D DISPLAY_CLASS=NullDisplayDriver
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${t1000-a.build_src_filter}
  +<helpers/ui/NullDisplayDriver.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${t1000-a.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; Debug build: same firmware plus the development tools (BLE console with "dfu", "power", "power log", "chg",
; "gps", "bat", "beep", "led", "blelog"; power log). The release build above has none of them: update it by
; holding the button 6 s (DFU bootloader), then flash.
[env:t1000a_companion_radio_ble_debug]
extends = env:t1000a_companion_radio_ble
build_flags = ${env:t1000a_companion_radio_ble.build_flags}
  -D T1000A_BLE_CONSOLE
  -D T1000A_DEBUG
  -D LR11X0_DIAG
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
